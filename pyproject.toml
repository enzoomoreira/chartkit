[project]
name = "chartkit"
version = "0.1.0"
description = "Biblioteca de charting padronizado para DataFrames pandas"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "babel>=2.17.0",
    "cachetools>=6.2.6",
    "matplotlib>=3.10.0",
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.12.0",
]

[project.optional-dependencies]
jupyter = [
    "ipykernel>=6.29",
    "ipywidgets>=8.1",
]

[dependency-groups]
dev = [
    "pytest>=9.0",
    "pyright>=1.1.390",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chartkit"]

[tool.hatch.build.targets.sdist]
include = [
    "src/chartkit",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    # The formatter already wraps what it can; the remainder is long strings
    # and URLs in docstrings, which wrapping would only make harder to read.
    "E501",
    # __all__ and __slots__ are grouped by meaning here, not alphabetically.
    "RUF022",
    "RUF023",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--tb=short", "-q"]
markers = ["slow: marks slower tests (e.g. config loading with real files)"]
filterwarnings = ["error", "ignore::UserWarning:matplotlib"]

# Exemplo de configuracao do chartkit via pyproject.toml
