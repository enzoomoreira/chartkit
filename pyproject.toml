[project]
name = "chartkit"
version = "0.1.0"
description = "Standardised financial charting for pandas DataFrames"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Enzo Moreira", email = "enzomoreira@protonmail.com" }]
keywords = [
    "charts",
    "finance",
    "matplotlib",
    "pandas",
    "plotting",
    "visualization",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Matplotlib",
    "Intended Audience :: Financial and Insurance Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
    "Topic :: Scientific/Engineering :: Visualization",
    "Typing :: Typed",
]
dependencies = [
    "babel>=2.17.0",
    "matplotlib>=3.10.0",
    "numpy>=2.0.0",
    # Lower bound is exercised by the CI matrix, which runs the suite against
    # 2.2 and 3.0 on both Linux and Windows. No upper cap: capping a library's
    # core dependency forces every downstream project to wait on a release.
    "pandas>=2.2.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.12.0",
]

[project.urls]
Homepage = "https://github.com/enzomoreira/chartkit"
Documentation = "https://github.com/enzomoreira/chartkit/tree/master/docs"
Repository = "https://github.com/enzomoreira/chartkit"
Changelog = "https://github.com/enzomoreira/chartkit/blob/master/CHANGELOG.md"
Issues = "https://github.com/enzomoreira/chartkit/issues"

[project.optional-dependencies]
jupyter = [
    "ipykernel>=6.29",
    "ipywidgets>=8.1",
]

[dependency-groups]
dev = [
    "pytest>=9.0",
    "pyright>=1.1.390",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chartkit"]

[tool.hatch.build.targets.sdist]
include = [
    "src/chartkit",
    "tests",
    "docs",
    "CHANGELOG.md",
    "LICENSE",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    # The formatter already wraps what it can; the remainder is long strings
    # and URLs in docstrings, which wrapping would only make harder to read.
    "E501",
    # __all__ and __slots__ are grouped by meaning here, not alphabetically.
    "RUF022",
    "RUF023",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--tb=short", "-q"]
markers = ["slow: marks slower tests (e.g. config loading with real files)"]
filterwarnings = ["error", "ignore::UserWarning:matplotlib"]

